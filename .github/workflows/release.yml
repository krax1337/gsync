name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts and a section in
# CHANGELOG.md) to build, sign and publish the APK as a GitHub release.
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# No dependency caching anywhere in this workflow: release artifacts must not be built from a
# cache that a less-privileged workflow could have poisoned.

jobs:
  verify:
    name: Verify tag, versionName and CHANGELOG
    if: github.repository == 'krax1337/gsync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against versionName and CHANGELOG.md
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (vX.Y.Z or vX.Y.Z-pre)."
            exit 1
          fi
          version="${TAG#v}"
          app_version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          failed=0
          if [[ "$app_version" != "$version" ]]; then
            echo "::error file=app/build.gradle.kts::versionName is '$app_version', expected '$version'."
            failed=1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section."
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Test and build (unsigned)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
      - run: mise run sdk
      - run: mise run test
      - run: mise exec -- ./gradlew :app:assembleRelease -Punsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The signing key lives in this environment only. This job runs nothing from the repository
    # and no build tooling: it downloads the APK and signs it with the runner's own apksigner.
    environment: release
    permissions: {}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Certificate of the release key. An APK signed by anything else is not published.
      SIGNING_CERT_SHA256: 2cb66bfd8bcafba9f6483453188b0a370e5be8294513471d598fc4fc8bcf0ac6
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned
      - name: Sign and check the signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing from the 'release' environment."
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")

          mkdir -p dist
          apk="dist/gsync-$VERSION.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias gsync --ks-pass env:KEYSTORE_PASSWORD \
            --out "$apk" unsigned/app-release-unsigned.apk
          rm -f "$apk.idsig"

          signer="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [[ "$signer" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::APK is signed by '$signer', expected the release key."
            exit 1
          fi
          (cd dist && sha256sum "gsync-$VERSION.apk" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # build provenance (public repositories only)
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify the checksum
        run: cd dist && sha256sum --check SHA256SUMS
      # GitHub only records attestations for public repositories on this plan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/gsync-${{ needs.verify.outputs.version }}.apk
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # Release notes are this version's section of the changelog.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" { printing = index($0, "## [" version "]") == 1; next }
            printing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "dist/gsync-$VERSION.apk" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "G-Sync $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
